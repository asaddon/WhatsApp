<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>WhatsApp Chat Box - Local Test</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .panel {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(8px);
        padding: 24px 32px;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        max-width: 480px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      h1 {
        font-size: 20px;
        margin-top: 0;
        margin-bottom: 8px;
        color: #49e670;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #94a3b8;
        margin-bottom: 16px;
      }
      .btn-group {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      button {
        flex: 1;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .btn-active {
        background: #49e670;
        color: #0f172a;
      }
      .btn-inactive {
        background: #334155;
        color: #cbd5e1;
      }
      .status {
        font-size: 12px;
        color: #38bdf8;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>WhatsApp Widget Test Page</h1>
      <p>Use the buttons below to re-initialize the widget with different configurations without needing to reload or commit anything.</p>
      <div class="btn-group">
        <button id="btnPopup" class="btn-active" onclick="switchMode(true)">Popup Mode (popup: true)</button>
        <button id="btnDirect" class="btn-inactive" onclick="switchMode(false)">Direct Link Mode (popup: false)</button>
      </div>
      <div class="status" id="statusText">Current mode: popup: true (opens chat card on click)</div>
    </div>

    <script src="WhatsAppChatBox.min.js"></script>
    <script>
      let currentWidget = null;

      function initWidget(popup) {
        // Remove existing widget iframe if any
        const existingIframe = document.querySelector("iframe");
        if (existingIframe) existingIframe.remove();

        currentWidget = new window.WAChatBox({
          link: "https://wa.me/919999999999",
          popup: popup,
          user: {
            name: "Alice",
            avatar: "https://randomuser.me/api/portraits/women/66.jpg",
            status: "Typically replies within an hour",
          },
          text: "Hey There 👋<br><br>Testing the WhatsApp chatbox locally!",
          tooltipText: popup ? "Chat with Alice" : "Open WhatsApp Directly",
          tooltipTimeout: 8000,
        });

        document.getElementById("btnPopup").className = popup ? "btn-active" : "btn-inactive";
        document.getElementById("btnDirect").className = !popup ? "btn-active" : "btn-inactive";
        document.getElementById("statusText").innerText = popup
          ? "Current mode: popup: true (clicking button opens chat card)"
          : "Current mode: popup: false (clicking button directly opens link)";
      }

      function switchMode(popup) {
        initWidget(popup);
      }

      // Initialize with popup: true by default
      initWidget(true);
    </script>
  </body>
</html>
